networks:
  navidrome_internal_net:
    driver: bridge
    
services:
  caddy-navidrome:
    image: caddy:2
    restart: unless-stopped
    environment:
      - EMBEDDED_SERVER_ADDRESS=${EMBEDDED_SERVER_ADDRESS:-}
    ports:
      - "${MUSIC_PORT:-80}:80"
    volumes:
      - ./caddy_root:/usr/share/caddy
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - navidrome_internal_net

volumes:
  caddy_data:
  caddy_config: